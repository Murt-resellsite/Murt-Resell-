<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Murt_Resell</title>
<style id="site-css">
/* Layout: plugged-in drop page. A red ticker on top, logo-led header, a hero with the neon sneaker mark and sticker badges, a live "current" line, big outlined department panels, a scrolling brand strip, then a dense product grid. The owner's edit sheet slides over the shop. One dark look, taken from the logo. */
:root{
  color-scheme:dark;
  --paper:#151214;
  --surface:#1e191d;
  --stone:#272126;
  --line:#3a3138;
  --ink:#f6f1ea;
  --muted:#aa9fa7;
  --accent:#ff3b21;
  --accent-ink:#ffffff;
  --blue:#36a4ea;
  --blue-ink:#07131c;
  --faint:rgba(246,241,234,.2);
  --select:rgba(255,59,33,.12);
  --scrim:rgba(6,4,6,.74);
  --band:#ff3b21;
  --band-ink:#140d10;
  --band-muted:#aa9fa7;
  --foot:#0d0a0c;
  --glow-red:rgba(255,59,33,.55);
  --glow-blue:rgba(54,164,234,.45);
  --ok:#4fd18b;
  --warn:#ffb23f;
  --danger:#ff5a4a;
  --display:"Anton","Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --sans:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,48px);
  --maxw:1360px;
  --radius:3px;
  --t-xs:.72rem;
  --t-sm:.88rem;
  --t-md:1rem;
  --t-lg:1.12rem;
  --t-xl:clamp(2.4rem,5.4vw,4.4rem);
  --t-hero:clamp(3rem,8.4vw,7.6rem);
}
*,*::before,*::after{box-sizing:border-box}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--t-md);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--accent);color:#fff}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.eyebrow{margin:0;font-family:var(--mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.display{font-family:var(--display);font-weight:400;line-height:.92;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance;margin:0}
.display em,.hero-title em{font-style:normal;color:var(--accent);text-shadow:0 0 28px var(--glow-red)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:50px;padding:0 1.5em;border:2px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--sans);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-decoration:none;cursor:pointer;border-radius:var(--radius);transition:transform .15s ease,box-shadow .15s ease,background-color .2s,color .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:active{transform:translate(1px,1px)}
.btn-solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:4px 4px 0 var(--blue)}
.btn-solid:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--blue)}
.btn-blue{border-color:var(--blue);color:var(--blue)}
.btn-blue:hover{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed;pointer-events:none;box-shadow:none}
.btn-sm{min-height:38px;padding:0 1.1em;font-size:.7rem;box-shadow:none}
.btn-sm.btn-solid{box-shadow:3px 3px 0 var(--blue)}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-size:inherit;color:inherit}
.input,.select{height:44px;border:1px solid var(--line);background:var(--surface);padding:0 12px;border-radius:var(--radius);min-width:0}
.input:focus,.select:focus{border-color:var(--blue);outline:none}

/* ticker */
.mq{overflow:hidden;max-width:100%;white-space:nowrap}
.mq-track{display:flex;width:max-content;animation:mq var(--mq-speed,38s) linear infinite}
.mq-run{display:flex;align-items:center;flex:none}
.mq:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.ticker{background:var(--band);color:var(--band-ink)}
.ticker .mq-run span{font-family:var(--mono);font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding-block:9px}
.ticker .mq-run i{display:inline-block;width:6px;height:6px;margin-inline:22px;background:var(--band-ink);transform:rotate(45deg)}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(21,18,20,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;min-height:72px;gap:16px}
.brandmark{display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--blue)}
.brandmark img{height:34px;width:auto;filter:drop-shadow(0 0 10px var(--glow-blue))}
.wordmark-text{font-family:var(--display);font-size:1.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
.nav{display:flex;justify-content:center;gap:6px}
.nav button,.header-actions a,.bag-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:8px 14px;cursor:pointer;font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-radius:999px;transition:background-color .2s,color .2s}
.nav button:hover,.header-actions a:hover,.bag-btn:hover{background:var(--surface)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.header-actions{display:flex;justify-content:flex-end;gap:4px;align-items:center}
.bag-count{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--mono);font-size:.7rem;letter-spacing:0}
.bag-count.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.35)}}
@media (max-width:760px){
  .nav .nav-extra,.header-actions .hide-sm{display:none}
  .head-in{min-height:60px;grid-template-columns:auto 1fr auto}
  .brandmark img{height:26px}
  .nav button,.header-actions a,.bag-btn{padding:8px 10px}
}

/* hero */
.hero{position:relative;padding-block:clamp(34px,6vw,84px) 0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);align-items:center}
.hero-copy{display:grid;gap:24px;justify-items:start;min-width:0}
.live{display:inline-flex;align-items:center;gap:10px;margin:0;padding:7px 14px 7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--glow-red);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow-red)}70%{box-shadow:0 0 0 12px rgba(255,59,33,0)}100%{box-shadow:0 0 0 0 rgba(255,59,33,0)}}
.hero-title{font-family:var(--display);font-weight:400;font-size:var(--t-hero);line-height:.9;text-transform:uppercase;letter-spacing:.005em;margin:0;text-wrap:balance}
.lede{margin:0;max-width:46ch;color:var(--muted);font-size:var(--t-lg)}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px}
.hero-stats{display:flex;flex-wrap:wrap;gap:12px 36px;margin:6px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.hero-stats div{display:grid;gap:2px}
.hero-stats dt{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero-stats dd{margin:0;font-family:var(--display);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.hero-stats dd.red{color:var(--accent)}
.hero-art{position:relative;aspect-ratio:1/1;width:100%;max-width:560px;justify-self:center;display:grid;place-items:center;isolation:isolate}
.hero-art .glow{position:absolute;border-radius:50%;filter:blur(40px);z-index:-1}
.hero-art .g1{width:70%;height:55%;left:8%;top:22%;background:radial-gradient(closest-side,rgba(255,59,33,.42),rgba(255,59,33,0))}
.hero-art .g2{width:55%;height:45%;right:2%;bottom:6%;background:radial-gradient(closest-side,rgba(54,164,234,.32),rgba(54,164,234,0))}
.hero-art .ring{position:absolute;inset:9%;border:1px dashed var(--line);border-radius:50%;z-index:-1;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-mark{width:86%;height:auto;filter:drop-shadow(0 0 3px #ff3b21) drop-shadow(0 0 18px rgba(255,59,33,.65)) drop-shadow(0 0 46px rgba(255,59,33,.35));animation:flicker 2.6s linear 1 both,hum 4s ease-in-out 2.6s infinite}
@keyframes flicker{0%,6%,10%,40%,44%{opacity:1}4%,8%,42%{opacity:.35}}
@keyframes hum{50%{filter:drop-shadow(0 0 3px #ff3b21) drop-shadow(0 0 26px rgba(255,59,33,.8)) drop-shadow(0 0 60px rgba(255,59,33,.45))}}
.hero-photo{position:absolute;inset:6%;overflow:hidden;border:1px solid var(--line);z-index:-1}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.sticker{position:absolute;padding:8px 14px;border-radius:999px;font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:float 6s ease-in-out infinite}
.sticker.s1{top:10%;left:2%;background:var(--ink);color:var(--paper);transform:rotate(-8deg);--r:-8deg}
.sticker.s2{top:16%;right:0;background:var(--blue);color:var(--blue-ink);transform:rotate(7deg);--r:7deg;animation-delay:-2s}
.sticker.s3{bottom:12%;left:10%;background:var(--accent);color:#fff;transform:rotate(4deg);--r:4deg;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-8px) rotate(var(--r,0deg))}}
.cord{position:relative;height:2px;margin-top:clamp(28px,4vw,52px);background:var(--line);overflow:hidden}
.cord span{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0,transparent 40%,var(--accent) 48%,#fff 50%,var(--blue) 52%,transparent 60%,transparent 100%);background-size:200% 100%;animation:current 3.2s linear infinite}
@keyframes current{from{background-position:100% 0}to{background-position:-100% 0}}
@media (max-width:860px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:420px;order:-1;margin-bottom:-12px}
}
@media (max-width:480px){.sticker{font-size:.62rem;padding:6px 10px}}

/* departments */
.depts-wrap{padding-block:clamp(28px,4vw,48px) 0}
.depts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6vw,20px)}
.dept{--c:var(--accent);--g:var(--glow-red);container-type:inline-size;position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:18px;min-height:clamp(260px,30vw,380px);padding:clamp(20px,3vw,32px);background:var(--surface);color:var(--ink);text-align:left;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;overflow:hidden;isolation:isolate;transition:border-color .25s,transform .25s}
.dept-fragrance{--c:var(--blue);--g:var(--glow-blue)}
.dept::before{content:"";position:absolute;width:70%;aspect-ratio:1;right:-20%;top:-35%;border-radius:50%;background:radial-gradient(closest-side,var(--g),transparent);opacity:.45;z-index:-1;transition:opacity .35s,transform .5s}
.dept:hover{border-color:var(--c);transform:translateY(-3px)}
.dept:hover::before{opacity:.9;transform:scale(1.15)}
.dept-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.dept-run{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dept-count{font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--c);color:#fff;white-space:nowrap}
.dept-fragrance .dept-count{color:var(--blue-ink)}
.dept-word{align-self:end;font-family:var(--display);font-size:clamp(2.4rem,6.4vw,6rem);font-size:clamp(2.4rem,16cqi,7rem);line-height:.85;text-transform:uppercase;white-space:nowrap;color:transparent;-webkit-text-stroke:2px var(--c);transition:color .3s,text-shadow .3s}
.dept:hover .dept-word{color:var(--c);text-shadow:0 0 30px var(--g)}
.dept-meta{display:flex;justify-content:space-between;gap:16px;align-items:end;border-top:1px solid var(--line);padding-top:14px}
.dept-blurb{max-width:38ch;color:var(--muted);font-size:var(--t-sm)}
.dept-go{font-family:var(--sans);font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--c);transition:transform .25s}
.dept:hover .dept-go{transform:translateX(6px)}
.dept > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.55;transition:opacity .3s,transform .6s}
.dept:hover > img{opacity:.7;transform:scale(1.04)}
.dept.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,10,.92),rgba(10,8,10,.2) 70%);z-index:-1}
@media (max-width:620px){.depts{grid-template-columns:minmax(0,1fr)}}

/* brand strip */
.brands{margin-top:clamp(36px,5vw,64px);border-block:1px solid var(--line);background:var(--surface);--mq-speed:46s}
.brands .mq-run span{font-family:var(--display);font-size:clamp(2rem,4.4vw,3.4rem);line-height:1;text-transform:uppercase;padding-block:16px}
.brands .mq-run span:nth-child(4n+1){color:var(--ink)}
.brands .mq-run span:nth-child(4n+3){color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.brands .mq-run i{display:inline-block;width:12px;height:12px;margin-inline:28px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--glow-red)}
.brands .mq-run i:nth-of-type(2n){background:var(--blue);box-shadow:0 0 14px var(--glow-blue)}

/* trust strip */
.trust{padding-top:clamp(36px,5vw,56px)}
.trust-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.4vw,16px)}
.trust-item{padding:18px 20px;display:grid;gap:4px;align-content:start;min-width:0;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent)}
.trust-item:nth-child(2){border-top-color:var(--blue)}
.trust-item:nth-child(3){border-top-color:var(--ink)}
.trust-item h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem;text-transform:uppercase;letter-spacing:.02em}
.trust-item p{margin:0;color:var(--muted);font-size:var(--t-sm)}
@media (max-width:760px){.trust-in{grid-template-columns:minmax(0,1fr)}}

/* shop */
.shop{padding-block:clamp(52px,7vw,96px);scroll-margin-top:70px}
.shop-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 32px;margin-bottom:20px}
.shop-head .display{font-size:var(--t-xl)}
.shop-count{margin:0;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shop-count::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.seg button{background:none;border:0;padding:9px 16px;cursor:pointer;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;transition:background-color .2s,color .2s}
.seg button:hover{background:var(--stone)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.filter-tools{display:flex;gap:10px;flex-wrap:wrap;min-width:0}
.filter-tools .input{width:min(260px,100%);background:var(--paper)}
.filter-tools .select{background:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.chips:empty{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 14px;font-size:.82rem;font-weight:600;cursor:pointer;border-radius:999px;transition:border-color .2s,background-color .2s}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--blue-ink)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(22px,2.6vw,36px) clamp(12px,1.6vw,20px);margin-top:26px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:grid;gap:12px;align-content:start;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;min-width:0}
.card-media{position:relative;display:block;aspect-ratio:4/5;background:var(--stone);overflow:hidden;max-width:100%;border:1px solid var(--line);border-radius:var(--radius);transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.card:hover .card-media{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 34px rgba(255,59,33,.2)}
.card-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s ease,opacity .4s ease}
.card-media img.alt{opacity:0}
.card:hover .card-media img.alt{opacity:1}
.card:hover .card-media img:first-child{transform:scale(1.05)}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.badge{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
.badge-hot{background:var(--accent);color:#fff}
.badge-new{background:var(--blue);color:var(--blue-ink)}
.badge-sample{background:transparent;border:1px solid var(--faint);color:var(--muted)}
.off{position:absolute;right:10px;bottom:10px;z-index:2;background:var(--accent);color:#fff;font-family:var(--mono);font-size:.74rem;font-weight:700;padding:5px 9px;border-radius:999px;transform:rotate(-6deg);box-shadow:0 6px 16px rgba(255,59,33,.35)}
.stamp{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%) rotate(-14deg);padding:4px 16px;border:3px solid var(--accent);color:var(--accent);font-family:var(--display);font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:.06em;text-transform:uppercase;background:rgba(21,18,20,.55);border-radius:4px}
.card-body{display:grid;gap:4px;min-width:0}
.card-brand{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card-name{font-size:1rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card-price{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:2px}
.price{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.retail{color:var(--muted);font-family:var(--mono);font-size:.78rem}
.retail s{text-decoration-thickness:1px}
.card-sizes{font-family:var(--mono);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.card.is-sold .card-media img{filter:grayscale(1);opacity:.4}
.card.is-sold .card-name,.card.is-sold .price{color:var(--muted)}
.card.is-sold:hover .card-media{border-color:var(--line);box-shadow:none}
.empty{grid-column:1/-1;display:grid;gap:12px;justify-items:start;padding:44px 28px;border:1px dashed var(--line);border-radius:var(--radius)}
.empty .display{font-size:clamp(2rem,4vw,3rem)}
.empty p{margin:0;color:var(--muted)}

/* product placeholders */
.ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;color:var(--muted)}
.ph-mono{font-family:var(--display);font-size:clamp(4rem,10vw,7rem);line-height:1;color:transparent;-webkit-text-stroke:2px var(--accent);opacity:.75}
.ph-cat{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase}
.ph-bottle{display:grid;justify-items:center;width:38%}
.ph-cap{width:44%;height:0;padding-bottom:18%;background:var(--blue);opacity:.8;border-radius:2px 2px 0 0}
.ph-neck{width:26%;height:0;padding-bottom:6%;border:2px solid var(--blue);border-top:0;border-bottom:0;opacity:.8}
.ph-body{width:100%;aspect-ratio:4/4.6;border:2px solid var(--blue);border-radius:9px 9px 6px 6px;display:grid;place-items:center;align-content:center;gap:4px;box-shadow:0 0 22px rgba(54,164,234,.18),inset 0 0 22px rgba(54,164,234,.12)}
.ph-init{font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.4rem);line-height:1;color:var(--blue)}
.ph-ml{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase}

/* text sections */
.section{padding-block:clamp(56px,8vw,112px);border-top:1px solid var(--line)}
.section-head{display:grid;gap:12px;margin-bottom:clamp(28px,4vw,48px);max-width:40ch}
.section-head .display{font-size:var(--t-xl)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,24px);list-style:none;padding:0;margin:0}
.step{position:relative;display:grid;gap:10px;align-content:start;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0;overflow:hidden}
.step-num{font-family:var(--display);font-size:4.4rem;line-height:.9;color:transparent;-webkit-text-stroke:2px var(--accent)}
.step:nth-child(2) .step-num{-webkit-text-stroke-color:var(--blue)}
.step:nth-child(3) .step-num{-webkit-text-stroke-color:var(--ink)}
.step h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;text-transform:uppercase}
.step p{margin:0;max-width:36ch;color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.about{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,6vw,96px);align-items:start}
.about .display{font-size:var(--t-xl)}
.about-mark{width:min(260px,70%);margin-top:20px;filter:drop-shadow(0 0 12px rgba(255,59,33,.5))}
.about-text{display:grid;gap:22px;font-size:var(--t-lg);max-width:60ch;min-width:0}
.about-text p{margin:0;white-space:pre-line}
@media (max-width:860px){.about{grid-template-columns:minmax(0,1fr)}}
.policies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,24px)}
.policy{display:grid;gap:10px;align-content:start;min-width:0;padding:22px;border:1px solid var(--line);border-radius:var(--radius)}
.policy h3{margin:0;font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--blue)}
.policy p{margin:0;color:var(--muted);white-space:pre-line}
@media (max-width:760px){.policies{grid-template-columns:minmax(0,1fr)}}
.site-footer{background:var(--foot);color:var(--ink);border-top:1px solid var(--line);padding-block:clamp(44px,6vw,76px) calc(clamp(44px,6vw,76px) + env(safe-area-inset-bottom,0px))}
.foot-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 48px;align-items:start}
.foot-brand{display:grid;gap:16px;justify-items:start}
.foot-brand .foot-mark-img{width:min(220px,60%);filter:drop-shadow(0 0 12px rgba(255,59,33,.45))}
.foot-brand .foot-word-img{width:min(300px,80%);filter:drop-shadow(0 0 10px var(--glow-blue))}
.foot-mark{margin:0;font-family:var(--display);font-size:clamp(2rem,5vw,3.4rem);text-transform:uppercase;line-height:1;overflow-wrap:anywhere;color:var(--blue)}
.foot-tag{margin:0;color:var(--muted);font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}
.foot-contact{display:grid;gap:10px;justify-items:start}
.foot-contact a{font-family:var(--display);font-size:clamp(1.6rem,3vw,2.2rem);text-transform:uppercase;text-decoration:none;color:var(--ink);transition:color .2s}
.foot-contact a:hover{color:var(--accent)}
.foot-legal{grid-column:1/-1;margin:0;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;max-width:90ch}
.sel{user-select:all;font-family:var(--mono)}
@media (max-width:760px){.foot-in{grid-template-columns:minmax(0,1fr)}}

/* layers: modal, drawer, toast */
.layer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:clamp(0px,3vw,40px)}
.scrim{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{position:relative;width:min(1100px,100%);max-height:100%;overflow:auto;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.close-x{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.25rem;line-height:1;display:grid;place-items:center;border-radius:50%}
.close-x:hover{border-color:var(--accent);color:var(--accent)}
.layer > .close-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:3}
.modal-media{background:var(--stone);display:grid;align-content:start;min-width:0}
.modal-main{position:relative;aspect-ratio:4/5;overflow:hidden;max-width:100%}
.modal-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{position:relative;width:62px;aspect-ratio:4/5;border:2px solid transparent;padding:0;background:var(--paper);cursor:pointer;flex:none;overflow:hidden}
.thumbs button img{width:100%;height:100%;object-fit:cover}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.modal-info{padding:clamp(24px,4vw,48px);padding-top:clamp(56px,6vw,64px);display:grid;gap:20px;align-content:start;min-width:0}
.m-title{font-size:clamp(2.2rem,4vw,3.4rem)}
.m-price{margin:0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:1.5rem}
.m-price .off{position:static;transform:none;font-size:.78rem}
.specs{margin:0;display:grid;gap:0;border-top:1px solid var(--line)}
.spec{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding-block:10px;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.spec dt{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.spec dd{margin:0;overflow-wrap:anywhere}
.pyramid{display:grid;gap:3px}
.pyramid span{display:block}
.pyramid b{font-weight:700;color:var(--blue)}
.m-desc{margin:0;color:var(--muted);white-space:pre-line}
.size-label{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.size-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.size-chip{min-width:54px;height:46px;padding:0 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono);font-weight:700;border-radius:var(--radius);transition:border-color .15s,background-color .15s}
.size-chip:hover{border-color:var(--ink)}
.size-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.size-need .size-chip{border-color:var(--danger);animation:shake .3s ease}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.buy-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}
.hint{margin:0;color:var(--muted);font-size:.84rem}
.hint.is-error{color:var(--danger)}
.msg-box{display:grid;gap:10px;border:1px solid var(--blue);background:rgba(54,164,234,.08);padding:14px;border-radius:var(--radius)}
.msg-box p{margin:0;font-size:var(--t-sm);font-weight:600}
.msg-box pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;user-select:all;overflow-wrap:anywhere}
.msg-box .msg-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.assure{margin:0;font-size:.84rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px}
@media (max-width:760px){
  .layer{padding:0}
  .modal{grid-template-columns:minmax(0,1fr);height:100%;padding-top:env(safe-area-inset-top,0px);border:0}
  .editor{height:100%;padding-top:calc(64px + env(safe-area-inset-top,0px))}
  .modal-main{aspect-ratio:1/1}
  .buy-row{grid-template-columns:minmax(0,1fr)}
}
.drawer-layer{place-items:stretch end;padding:0}
.drawer{position:relative;width:min(440px,100%);height:100%;background:var(--paper);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head .display{font-size:2rem}
.drawer-head .close-x{position:static}
.drawer-body{overflow:auto;padding:8px 20px}
.bag-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;padding-block:14px;border-bottom:1px solid var(--line);align-items:start}
.bag-thumb{position:relative;aspect-ratio:4/5;background:var(--stone);overflow:hidden;border-radius:var(--radius)}
.bag-thumb img{width:100%;height:100%;object-fit:cover}
.bag-thumb .ph-mono{font-size:2rem;-webkit-text-stroke-width:1.5px}
.bag-item h3{margin:0;font-size:.95rem;font-weight:600;overflow-wrap:anywhere}
.bag-item p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.drawer-foot{display:grid;gap:12px;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:1.8rem;text-transform:uppercase}
.total span:last-child{font-family:var(--mono);font-size:1.3rem;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--paper);padding:12px 18px;font-size:var(--t-sm);font-weight:600;width:max-content;max-width:min(92vw,520px);border-radius:var(--radius);box-shadow:4px 4px 0 var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fab .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* edit mode */
.admin-layer{z-index:60;padding:0;display:block}
.sheet{position:absolute;inset:0;background:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.sheet-head{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);background:var(--surface)}
.sheet-head-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:14px}
.sheet-title{font-size:1.9rem}
.tabs{display:inline-flex;border:1px solid var(--line);background:var(--surface);max-width:100%;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 16px;cursor:pointer;font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.tabs button + button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.sheet-body{overflow:auto;padding-block:24px 48px}
.adm-stack{display:grid;gap:20px}
.savebar{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:12px}
.save-status{display:grid;gap:4px;font-size:var(--t-sm);min-width:0}
.save-status strong{font-weight:500}
.meter{display:flex;align-items:center;gap:10px;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter-bar{width:120px;height:4px;background:var(--line);position:relative;overflow:hidden}
.meter-bar span{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter-bar span.is-warn{background:var(--warn)}
.save-actions{display:flex;gap:10px;flex-wrap:wrap}
.notice{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--surface);padding:14px 18px}
.notice p{margin:0;font-size:var(--t-sm)}
.notice-actions{display:flex;gap:10px;flex-wrap:wrap}
.checklist{border:1px solid var(--line);background:var(--surface);padding:18px clamp(16px,2.4vw,24px);display:grid;gap:12px}
.checklist h3{margin:0;font-size:var(--t-xs);letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.checklist ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checklist li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:var(--t-sm)}
.check{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--line);border-radius:50%;font-size:.7rem;flex:none}
.checklist li.done{color:var(--muted)}
.checklist li.done .check{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.checklist li.done .lbl{text-decoration:line-through}
.adm-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.adm-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}
.bulkbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--ink);color:var(--paper)}
.bulkbar[hidden]{display:none!important}
.bulkbar .btn{border-color:var(--paper);color:var(--paper);min-height:34px}
.bulkbar .btn:hover{background:var(--paper);color:var(--ink)}
.bulkbar .btn-danger{border-color:var(--danger);color:var(--paper);background:var(--danger)}
.bulkbar .select{height:34px;background:var(--ink);color:var(--paper);border-color:rgba(255,255,255,.4)}
.bulkbar strong{font-weight:500;font-size:var(--t-sm);margin-right:4px}
.table-scroll{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
.ptable{width:100%;border-collapse:collapse;min-width:1080px;font-size:.9rem}
.ptable th{text-align:left;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.ptable td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tr:last-child td{border-bottom:0}
.ptable tr.is-sel td{background:var(--select)}
.ptable .c-check{width:40px;text-align:center}
.ptable .c-thumb{width:62px}
.ptable .c-num{width:96px}
.ptable .c-status{width:128px}
.ptable .c-feat{width:70px;text-align:center}
.ptable .c-edit{width:64px}
.cell{width:100%;min-width:0;height:38px;border:1px solid transparent;background:transparent;padding:0 8px;border-radius:var(--radius)}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--ink);background:var(--paper);outline:none}
.cell.num{text-align:right;font-variant-numeric:tabular-nums}
select.cell{cursor:pointer}
select.cell[data-status="available"]{color:var(--ok)}
select.cell[data-status="sold"]{color:var(--muted)}
select.cell[data-status="draft"]{color:var(--warn)}
.thumb{position:relative;width:46px;height:56px;padding:0;border:0;background:var(--stone);cursor:pointer;display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini-tag{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);font-family:var(--sans);font-style:normal;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:1px 0}
.row-empty{padding:28px 12px;color:var(--muted);text-align:center}
.adm-block{border:1px solid var(--line);background:var(--surface);padding:clamp(18px,3vw,30px);display:grid;gap:16px;min-width:0}
.adm-block h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.7rem;text-transform:uppercase}
.adm-block > p,.adm-block .help{margin:0;color:var(--muted);font-size:var(--t-sm);max-width:72ch}
.cols{margin:0;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.cols code{font-family:inherit;color:var(--ink)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field > span:not(.help){font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field.full{grid-column:1/-1}
.field .help{font-size:.8rem;color:var(--muted)}
.ctl{width:100%;min-height:44px;border:1px solid var(--line);background:var(--paper);padding:9px 12px;border-radius:var(--radius)}
.ctl:focus{border-color:var(--ink);outline:none}
textarea.ctl{min-height:100px;resize:vertical;line-height:1.5}
.check-field{display:flex;gap:10px;align-items:center;font-size:var(--t-sm);cursor:pointer}
.check-field input{width:18px;height:18px;accent-color:var(--accent)}
.radio-row{display:flex;flex-wrap:wrap;gap:10px 20px}
@media (max-width:680px){.form-grid,.form-grid.three{grid-template-columns:minmax(0,1fr)}}
.drop{position:relative;display:grid;place-items:center;gap:6px;min-height:150px;border:1.5px dashed var(--line);background:var(--paper);text-align:center;padding:22px;cursor:pointer;color:var(--muted);font-size:var(--t-sm)}
.drop strong{color:var(--ink);font-weight:500}
.drop.is-over{border-color:var(--accent);color:var(--ink);background:var(--select)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.progress{margin:0;font-size:var(--t-sm);color:var(--muted);min-height:1.4em}
.preview-scroll{overflow-x:auto;border:1px solid var(--line)}
.preview{width:100%;border-collapse:collapse;font-size:.84rem;min-width:640px}
.preview th,.preview td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.preview th{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.preview td.num{text-align:right;font-variant-numeric:tabular-nums}
.warn-text{color:var(--warn);font-size:var(--t-sm);margin:0}
.img-setting{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.img-prev{width:96px;height:64px;background:var(--stone);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.7rem;flex:none}
.img-prev img{width:100%;height:100%;object-fit:contain}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.editor-layer{z-index:70}
.editor{position:relative;width:min(960px,100%);max-height:100%;overflow:auto;background:var(--paper);display:grid;gap:22px;padding:clamp(20px,3vw,36px);padding-top:clamp(60px,6vw,64px)}
.editor-head{display:grid;gap:6px}
.editor-head .display{font-size:2.4rem}
.editor-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px}
.editor-foot .grp{display:flex;gap:10px;flex-wrap:wrap}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.photo{position:relative;aspect-ratio:4/5;background:var(--stone);overflow:hidden;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.photo-tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:var(--paper);border-top:1px solid var(--line)}
.photo-tools button{flex:1;height:32px;border:0;background:none;cursor:pointer;font-size:.9rem}
.photo-tools button + button{border-left:1px solid var(--line)}
.photo-tools button:hover{background:var(--stone)}
.cover-tag{position:absolute;top:6px;left:6px;background:var(--ink);color:var(--paper);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 6px}
.photo-add{display:grid;place-items:center;text-align:center;aspect-ratio:4/5;border:1.5px dashed var(--line);color:var(--muted);font-size:.8rem;padding:10px;position:relative;cursor:pointer}

function visibleProducts(s) {
  return s.products.filter(function (p) { return p.status !== 'draft' && (s.settings.showSold || p.status !== 'sold'); });
}
function filtered(s) {
  var q = ui.q.trim().toLowerCase();
  var list = visibleProducts(s).filter(function (p) {
    if (ui.dept !== 'all' && p.dept !== ui.dept) return false;
    if (ui.cat !== 'all' && p.category !== ui.cat) return false;
    if (q && [p.name, p.brand, p.category, p.description, p.top, p.heart, p.base, p.conc].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  function t(p) { return Date.parse(p.createdAt) || 0; }
  function pr(p, hi) { return p.price === '' ? (hi ? -1 : Infinity) : Number(p.price); }
  list.sort(function (a, b) {
    var sa = a.status === 'sold', sb = b.status === 'sold';
    if (sa !== sb) return sa ? 1 : -1;
    if (ui.sort === 'low') return pr(a) - pr(b);
    if (ui.sort === 'high') return pr(b, true) - pr(a, true);
    if (ui.sort === 'new') return t(b) - t(a);
    if (!!a.featured !== !!b.featured) return a.featured ? -1 : 1;
    return t(b) - t(a);
  });
  return list;
}
var newIds = {};
function computeNew(s) {
  newIds = {};
  var cutoff = Date.now() - 14 * 864e5;
  s.products.filter(function (p) { return p.status === 'available' && (Date.parse(p.createdAt) || 0) > cutoff; })
    .sort(function (a, b) { return (Date.parse(b.createdAt) || 0) - (Date.parse(a.createdAt) || 0); })
    .slice(0, 4).forEach(function (p) { newIds[p.id] = 1; });
}
function card(p) {
  var sold = p.status === 'sold', imgs = p.images || [], off = sold ? 0 : pctOff(p);
  var media = imgs.length ? '<img src="' + esc(imgs[0]) + '" alt="" loading="lazy" decoding="async">' + (imgs[1] ? '<img class="alt" src="' + esc(imgs[1]) + '" alt="" loading="lazy" decoding="async">' : '') : placeholder(p);
  var badges = (!sold && p.featured ? '<span class="badge badge-hot">Hot</span>' : '') + (!sold && newIds[p.id] ? '<span class="badge badge-new">Just in</span>' : '') + (p.sample ? '<span class="badge badge-sample">Sample</span>' : '');
  var st = sizesText(p);
  return '<button type="button" class="card' + (sold ? ' is-sold' : '') + '" data-act="open" data-id="' + esc(p.id) + '">' +
    '<span class="card-media">' + media + '<span class="badges">' + badges + '</span>' + (off >= 5 ? '<span class="off">-' + off + '%</span>' : '') + (sold ? '<span class="stamp">Sold</span>' : '') + '</span>' +
    '<span class="card-body"><span class="card-brand">' + esc(p.brand || DEPTS[p.dept]) + '</span><span class="card-name">' + esc(p.name || 'Untitled piece') + '</span>' +
    '<span class="card-price"><span class="price">' + (sold ? 'Sold out' : (fmt(p.price) || 'Price on request')) + '</span>' + (sold ? '' : retailHTML(p)) + '</span>' +
    (st ? '<span class="card-sizes">' + esc(st) + '</span>' : '') + '</span></button>';
}
function renderGrid() {
  var s = view(), grid = $('#grid');
  if (!grid) return;
  $('#dept-seg').innerHTML = ['all', 'streetwear', 'fragrance'].map(function (d) {
    return '<button type="button" data-act="dept" data-v="' + d + '" aria-pressed="' + (ui.dept === d) + '">' + (d === 'all' ? 'All' : DEPTS[d]) + '</button>';
  }).join('');
  $$('.nav button').forEach(function (b) { b.setAttribute('aria-current', String(b.dataset.v === ui.dept)); });
  var chipsEl = $('#cat-chips');
  if (ui.dept === 'all') { chipsEl.innerHTML = ''; }
  else {
    var cats = [];
    visibleProducts(s).forEach(function (p) { if (p.dept === ui.dept && p.category && cats.indexOf(p.category) < 0) cats.push(p.category); });
    var order = s.settings.categories[ui.dept] || [];
    cats.sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    chipsEl.innerHTML = cats.length > 1 ? ['all'].concat(cats).map(function (c) {
      return '<button type="button" class="chip" data-act="cat" data-v="' + esc(c) + '" aria-pressed="' + (ui.cat === c) + '">' + (c === 'all' ? 'All ' + DEPTS[ui.dept].toLowerCase() : esc(c)) + '</button>';
    }).join('') : '';
  }
  computeNew(s);
  var list = filtered(s);
  var avail = list.filter(function (p) { return p.status === 'available'; }).length;
  $('#shop-count').textContent = plural(avail, 'piece', 'pieces') + ' available';
  if (list.length) { grid.innerHTML = list.map(card).join(''); return; }
  var any = visibleProducts(s).length > 0, h = handleOf(s.settings);
  if (any) {
    grid.innerHTML = '<div class="empty"><p class="display">Nothing matches that.</p><p>Try another search or category.</p><button type="button" class="btn btn-sm" data-act="clear-filters">Clear filters</button></div>';
  } else {
    grid.innerHTML = '<div class="empty"><p class="display">New pieces are on the way.</p><p>' + (h ? 'Follow <a href="https://instagram.com/' + esc(h) + '" target="_blank" rel="noopener">@' + esc(h) + '</a> on Instagram to catch the next drop.' : 'Check back soon for the next drop.') + '</p>' +
      (owner ? '<button type="button" class="btn btn-solid btn-sm" data-act="admin-open">Add your first product</button>' : '') + '</div>';
  }
}

function dmFor(p, size) {

}
function bagMessage() {
  var lines = [], total = 0, s = view();
  bag.forEach(function (b) {
    var p = findP(b.id, s);
    if (!p || p.status !== 'available') return;
    lines.push('- ' + itemLabel(p) + (b.size ? ', ' + (p.dept === 'fragrance' ? b.size : 'size ' + b.size) : '') + (p.price !== '' ? ', ' + fmt(p.price) : ''));

function copyText(text) {

    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
  } catch (e) {}

}

function publishNow(retried) {
  if (!draft || ui.saving) return;
  if (!artifactNs) { readOnlyView = true; renderSavebar(); toast('Saving is not available in this view. Open the store from your Claude account to publish.'); return; }
  var next = clone(draft);
  next.updatedAt = new Date().toISOString();
  var html = buildHTML(next);
  if (html.length > MAX_BYTES) { toast('The store is over the size limit (' + mb(html.length) + '). Remove some photos, then publish again.'); return; }
  ui.saving = true; renderSavebar();
  idb.set('draft', { base: published.updatedAt, target: next.updatedAt, savedAt: Date.now(), draft: next }).then(function () {
    return artifactNs.publish(html);
  }).then(function () {
    toast('Published. Reloading the live store…');
  }, function (err) {
    ui.saving = false;
    var code = err && err.code;
    if (code === 'conflict') { toast('A newer version was saved somewhere else. The page is reloading to it, and you can restore your changes after.'); return; }
    if (code === 'upstream_error' && !retried) { setTimeout(function () { publishNow(true); }, 800 + Math.random() * 1200); return; }
    if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].indexOf(code) >= 0) { readOnlyView = true; toast('This view cannot save changes. Open the store from your Claude account to publish.'); }
    else if (code === 'too_large') toast('The store is too large to save. Remove some photos, then publish again.');
    else if (code === 'rate_limited') toast('Saving too often. Wait a minute, then publish again.');
    else toast('Publishing failed. Your changes are still here; try again in a moment.');
    renderSavebar();
  });
}

    case 'nav': case 'dept':
      ui.dept = v; ui.cat = 'all'; renderGrid();
      if (act === 'nav') { var sh = $('#shop'); if (sh) sh.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); }
      break;
    case 'cat': ui.cat = v; renderGrid(); break;
    case 'clear-filters': ui.dept = 'all'; ui.cat = 'all'; ui.q = ''; var qi = $('#shop-q'); if (qi) qi.value = ''; renderGrid(); break;
    case 'open': openModal(id); break;
    case 'close-modal': closeModal(); break;
    case 'thumb': ui.mi = Number(a.dataset.i) || 0; renderModal(); break;
    case 'size': ui.size = v; renderModal(); break;
    case 'buy': {
      var p = findP(ui.modal);
      if (!p) break;
      if (needsSize(p) && !chosenSize(p)) {
        e.preventDefault();
        var hint = $('#buy-hint'); if (hint) { hint.textContent = 'Pick a size first.'; hint.classList.add('is-error'); }
        var sw = $('#size-wrap'); if (sw) { sw.classList.add('size-need'); var c1 = $('.size-chip', sw); if (c1) c1.focus(); }
        break;
      }
      var text = dmFor(p, chosenSize(p)), h = handleOf(view().settings);
      ui.msg = { id: p.id, text: text, copied: false, handle: h };
      copyText(text).then(function (ok) { if (ui.msg && ui.msg.text === text) { ui.msg.copied = ok; renderMsg(); } });
      renderMsg();
      break;
    }
    case 'ask-similar': {
      var ps = findP(ui.modal);
      if (ps) copyText("Hi! I saw the " + itemLabel(ps) + " sold. Do you have anything similar?");
      break;
    }
    case 'copy-msg':
      if (ui.msg) copyText(ui.msg.text).then(function (ok) { toast(ok ? 'Message copied.' : 'Select the message and copy it.'); if (!ok) { var m = $('#msg-text'); if (m) { var r = document.createRange(); r.selectNodeContents(m); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } } });
      break;
    case 'copy-text': copyText(a.dataset.text || '').then(function (ok) { toast(ok ? 'Copied.' : 'Select it and copy.'); }); break;
    case 'add-bag': {
      var pb = findP(ui.modal);
      if (!pb) break;
      if (needsSize(pb) && !chosenSize(pb)) {
        var hb = $('#buy-hint'); if (hb) { hb.textContent = 'Pick a size first.'; hb.classList.add('is-error'); }
        var swb = $('#size-wrap'); if (swb) swb.classList.add('size-need');
        break;
      }
      var sz = chosenSize(pb) || '';
      if (!bag.some(function (b) { return b.id === pb.id && b.size === sz; })) { bag.push({ id: pb.id, size: sz }); saveBag(); }
      updateBagCount();
      toast('Added to your bag.');
      break;
    }
    case 'bag-open': ui.bagOpen = true; renderBag(); var cx = $('#layer-bag .close-x'); if (cx) cx.focus(); break;
    case 'bag-close': ui.bagOpen = false; renderBag(); break;
    case 'bag-remove': bag.splice(Number(a.dataset.i), 1); saveBag(); updateBagCount(); renderBag(); break;
    case 'bag-buy': {
      var bt = bagMessage();
      copyText(bt).then(function (ok) { var hh = $('#bag-hint'); if (hh) hh.textContent = ok ? 'Order copied. Paste it in the Instagram DM.' : 'Copy failed. Your order: ' + bt.replace(/\n/g, ' '); });
      break;
    }

    /* owner */
    case 'admin-open': openAdmin(); break;
    case 'admin-close': closeAdmin(); break;
    case 'tab': ui.tab = v; ui.confirm = null; ui.fileOut = null; if (ui.editId) { ui.editId = null; renderEditor(); } renderAdmin(); break;
    case 'publish': publishNow(false); break;
    case 'discard': ui.confirm = 'discard'; renderSavebar(); break;
    case 'discard-yes':
      draft = clone(published); dirty = false; ui.confirm = null; ui.sel = {};
      idb.del('draft'); renderAdmin(); renderFab(); toast('Changes discarded.'); break;
    case 'confirm-cancel': ui.confirm = null; if (ui.editId) renderEditor(); if (ui.admin) { renderAdmin(); } break;
    case 'restore-yes': draft = normalize(ui.restore.draft); ui.restore = null; markDirty(); renderAdmin(); toast('Unsaved changes restored.'); break;
    case 'restore-no': ui.restore = null; idb.del('draft'); renderAdmin(); break;
    case 'ig-ok': draft.settings.igConfirmed = true; markDirty(); renderAdmin(); break;
    case 'remove-samples': ui.confirm = 'samples'; renderAdmin(); break;
    case 'remove-samples-yes':
      draft.products = draft.products.filter(function (x) { return !x.sample; }); ui.confirm = null; markDirty(); renderAdmin(); toast('Sample products removed.'); break;
    case 'new-product': {
      if (!ui.admin) openAdmin('products');
      var np = newProduct({ status: 'available' });
      markDirty(); renderAdmin(); openEditor(np.id, true);
      break;
    }
    case 'edit': openEditor(id, false); break;
    case 'editor-close': closeEditor(); break;
    case 'dup': {
      var src = findP(ui.editId, draft);
      if (!src) break;
      var cp = clone(src); cp.id = uid(); cp.sample = false; cp.createdAt = new Date().toISOString(); cp.name = (src.name || 'Untitled') + ' (copy)';
      draft.products.unshift(cp); markDirty(); openEditor(cp.id, false); toast('Duplicated. You are now editing the copy.');
      break;
    }
    case 'del': ui.confirm = 'del-one'; renderEditor(); break;
    case 'del-yes':
      draft.products = draft.products.filter(function (x) { return x.id !== ui.editId; }); delete ui.sel[ui.editId];
      ui.editId = null; ui.confirm = null; markDirty(); renderEditor(); renderAdmin(); toast('Product deleted.'); break;
    case 'img-left': case 'img-right': case 'img-del': {
      var pi = findP(ui.editId, draft), i = Number(a.dataset.i);
      if (!pi) break;
      if (act === 'img-del') pi.images.splice(i, 1);
      else { var j = act === 'img-left' ? i - 1 : i + 1; if (j < 0 || j >= pi.images.length) break; var tmp = pi.images[i]; pi.images[i] = pi.images[j]; pi.images[j] = tmp; }
      markDirty(); renderEditor(); break;
    }
    case 'bulk-status': selIds().forEach(function (k) { findP(k, draft).status = v; }); markDirty(); renderTable(); toast('Updated ' + plural(selIds().length, 'product', 'products') + '.'); break;
    case 'bulk-feature': selIds().forEach(function (k) { findP(k, draft).featured = true; }); markDirty(); renderTable(); break;
    case 'bulk-delete': ui.confirm = 'bulk-delete'; renderBulkbar(); break;
    case 'bulk-delete-yes': {
      var dels = selIds(), set = {}; dels.forEach(function (k) { set[k] = 1; });
      draft.products = draft.products.filter(function (x) { return !set[x.id]; });
      ui.sel = {}; ui.confirm = null; markDirty(); renderAdmin(); toast(plural(dels.length, 'product', 'products') + ' deleted.');
      break;
    }
    case 'sel-clear': ui.sel = {}; ui.confirm = null; renderTable(); break;
    case 'template': offerFile('murt-resell-products-template.csv', templateCSV()); break;
    case 'export': offerFile('murt-resell-products.csv', productsCSV(draft.products)); break;
    case 'copy-file': copyText(ui.fileOut ? ui.fileOut.text : '').then(function (ok) { if (ok) toast('Copied.'); else { var fo = $('#file-out'); if (fo) fo.select(); } }); break;
    case 'file-close': ui.fileOut = null; renderAdmin(); break;
    case 'sheet-parse': {
      var raw = ($('#sheet-text') || {}).value || '';
      if (!raw.trim()) { toast('Paste some rows first.'); break; }
      ui.sheet = Object.assign({ raw: raw }, rowsToProducts(parseDelimited(raw)));
      renderAdmin(); break;
    }
    case 'sheet-clear': ui.sheet = null; renderAdmin(); break;
    case 'sheet-add': {
      if (!ui.sheet || !ui.sheet.rows.length) break;
      var base = Date.now(), n = ui.sheet.rows.length;
      ui.sheet.rows.forEach(function (p, k) { p.id = uid() + k; p.createdAt = new Date(base + (n - k)).toISOString(); draft.products.unshift(p); });
      ui.sheet = null; markDirty(); ui.tab = 'products'; ui.astatus = 'all'; ui.adept = 'all'; ui.aq = ''; renderAdmin();
      toast(plural(n, 'product', 'products') + ' added. Open Edit on each to add photos.');
      break;
    }
    case 'img-clear': draft.settings[a.dataset.k] = ''; markDirty(); renderAdmin(); break;
  }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'shop-q') { ui.q = t.value; renderGrid(); return; }
  if (t.id === 'adm-q') { ui.aq = t.value; renderTable(); return; }
  if (t.dataset.pf && draft) {
    var p = findP(t.dataset.id, draft), f = t.dataset.pf;
    if (!p) return;
    if (f === 'name' || f === 'brand' || f === 'sizes') { p[f] = t.value; markDirty(); }
    else if (f === 'price' || f === 'retail') { p[f] = parsePrice(t.value); markDirty(); }
    return;
  }
  if (t.dataset.ef && draft) {
    var pe = findP(ui.editId, draft), fe = t.dataset.ef;
    if (!pe || fe === 'dept' || fe === 'status' || fe === 'featured' || t.tagName === 'SELECT') return;
    if (fe === 'price' || fe === 'retail') pe[fe] = parsePrice(t.value); else pe[fe] = t.value;
    if (fe === 'name') { var tt = $('#ed-title'); if (tt) tt.textContent = t.value || 'Untitled piece'; }
    markDirty();
    return;
  }
  if (t.dataset.s && draft && t.type !== 'checkbox') {
    var path = t.dataset.s;
    if (path.indexOf('categories.') === 0) return;
    setPath(draft.settings, path, t.value);
    if (path === 'instagram') draft.settings.igConfirmed = true;
    markDirty();
  }
});

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'shop-sort') { ui.sort = t.value; renderGrid(); return; }
  if (t.id === 'adm-dept') { ui.adept = t.value; renderTable(); return; }
  if (t.id === 'adm-status') { ui.astatus = t.value; renderTable(); return; }
  if (t.dataset.file) { handleFiles(t.dataset.file, t.files, t); t.value = ''; return; }
  if (t.dataset.sel) {
    ui.sel[t.dataset.sel] = t.checked; ui.confirm = null;
    var row = t.closest('tr'); if (row) row.classList.toggle('is-sel', t.checked);
    var list = adminList(), all = $('#sel-all'), picked = list.filter(function (p) { return ui.sel[p.id]; }).length;
    if (all) { all.checked = picked === list.length && picked > 0; all.indeterminate = picked > 0 && picked < list.length; }
    renderBulkbar(); return;
  }
  if (t.id === 'sel-all') { adminList().forEach(function (p) { ui.sel[p.id] = t.checked; }); ui.confirm = null; renderTable(); return; }
  if (t.id === 'bulk-move' && t.value) {
    var dc = t.value.split('|'), ids = selIds();
    ids.forEach(function (k) { var p = findP(k, draft); p.dept = dc[0]; p.category = dc[1] || ''; });
    markDirty(); renderTable(); toast('Moved ' + plural(ids.length, 'product', 'products') + '.'); return;
  }
  if (t.dataset.pf && draft) {
    var p2 = findP(t.dataset.id, draft), f = t.dataset.pf;
    if (!p2) return;
    if (f === 'cat') { var parts = t.value.split('|'); p2.dept = parts[0]; p2.category = parts.slice(1).join('|'); }
    else if (f === 'status') { p2.status = t.value; t.dataset.status = t.value; }
    else if (f === 'featured') p2.featured = t.checked;
    else return;
    markDirty(); return;
  }
  if (t.dataset.ef && draft) {
    var pe = findP(ui.editId, draft), fe = t.dataset.ef;
    if (!pe) return;
    if (fe === 'featured') pe.featured = t.checked;
    else if (fe === 'dept') { pe.dept = t.value; markDirty(); renderEditor(); return; }
    else if (t.tagName === 'SELECT') pe[fe] = t.value;
    else return;
    markDirty(); return;
  }
  if (t.dataset.s && draft) {
    var path = t.dataset.s;
    if (t.type === 'checkbox') { setPath(draft.settings, path, t.checked); markDirty(); return; }
    if (path.indexOf('categories.') === 0) {
      var arr = t.value.split(/\n|,/).map(function (x) { return x.trim(); }).filter(Boolean);
      setPath(draft.settings, path, arr.filter(function (x, i) { return arr.indexOf(x) === i; }));
      markDirty();
    }
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (ui.editId) { closeEditor(); return; }
  if (ui.modal) { closeModal(); return; }
  if (ui.bagOpen) { ui.bagOpen = false; renderBag(); return; }
  if (ui.admin) closeAdmin();
});
['dragenter', 'dragover'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { var d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return; e.preventDefault(); d.classList.add('is-over'); });
});
['dragleave', 'drop'].forEach(function (ev) {
  document.addEventListener(ev, function (e) {
    var d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return;
    if (ev === 'dragleave' && d.contains(e.relatedTarget)) return;
    d.classList.remove('is-over');
    if (ev === 'drop') { e.preventDefault(); handleFiles(d.dataset.drop, e.dataTransfer && e.dataTransfer.files, d); }
  });
});

/* ---------- boot ---------- */
function mountLayers() {
  ['layer-modal:layer', 'layer-bag:layer drawer-layer', 'layer-admin:layer admin-layer', 'layer-editor:layer editor-layer'].forEach(function (x) {
    var parts = x.split(':'), el = document.createElement('div');
    el.id = parts[0]; el.className = parts[1]; el.hidden = true;
    document.body.appendChild(el);
  });
  var fab = document.createElement('div'); fab.id = 'layer-fab'; document.body.appendChild(fab);
  var t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.hidden = true; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t);
}
function initOwner() {
  var c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  c.use('user').then(function (u) {
    if (!u) return false;
    return u.canEdit().catch(function () { return false; });
  }, function () { return false; }).then(function (can) {
    if (!can) return;
    owner = true;
    return c.use('artifact').then(function (ns) { artifactNs = ns || null; }, function () { artifactNs = null; }).then(function () {
      return idb.get('draft');
    }).then(function (rec) {
      if (rec && rec.target && rec.target === published.updatedAt) idb.del('draft');
      else if (rec && rec.draft) ui.restore = rec;
      renderFab();
      renderGrid();
    });
  });
}
mountLayers();
renderSite();
initOwner();
})();
</script>
